<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 人体经络穴位图谱 · 361 穴 · 真实解剖模型</title>
<style>
  :root{--ink:#e8e4da;--dim:#6b7684;--gold:#c9a227;--paper:#0d0f12;--panel:#14171c;--line:#242a33;--accent:#8b2f2f}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
    font:14px/1.6 "Songti SC","Noto Serif CJK SC",serif}
  #app{display:flex;height:100%}
  #side{width:272px;flex:0 0 272px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0}
  #side h1{font-size:15px;margin:0;padding:13px 14px 9px;letter-spacing:1px;color:#f0d9a8;border-bottom:1px solid var(--line)}
  .sec{padding:9px 12px;border-bottom:1px solid var(--line)}
  .sec .t{font-size:11px;letter-spacing:2px;color:var(--dim);margin-bottom:7px}
  .layers{display:flex;flex-wrap:wrap;gap:6px}
  .layers button{flex:1 1 44%;padding:6px 8px;border-radius:6px;cursor:pointer;font:inherit;font-size:12px;
    background:#0d0f12;color:#9aa6b4;border:1px solid #2c3540}
  .layers button.on{background:#2a2016;color:#f0d9a8;border-color:#6b5426}
  .views{display:flex;gap:5px}
  .views button{flex:1;padding:5px 0;border-radius:6px;cursor:pointer;font:inherit;font-size:12px;
    background:#0d0f12;color:#9aa6b4;border:1px solid #2c3540}
  .views button:hover{color:#f0d9a8;border-color:#6b5426}
  #q{margin:9px 12px;padding:7px 10px;border-radius:6px;border:1px solid #2c3540;background:#0d0f12;
    color:var(--ink);font-family:inherit;font-size:13px}
  #list{overflow:auto;flex:1;padding:0 8px 12px}
  .m{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:5px;cursor:pointer}
  .m:hover{background:#1c2128}
  .m input{accent-color:var(--gold)}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
  .m span{font-size:13px}
  .m em{color:var(--dim);font-style:normal;font-size:11px}
  #hint{padding:8px 12px;font-size:11px;color:var(--dim);border-top:1px solid var(--line);line-height:1.7}
  #stage{flex:1;position:relative;min-width:0}
  #detail{position:absolute;right:14px;top:14px;width:300px;max-height:calc(100% - 28px);overflow:auto;
    background:rgba(20,23,28,.95);border:1px solid #2c3540;border-radius:10px;padding:14px;display:none;
    backdrop-filter:blur(6px)}
  #detail h2{margin:0 0 2px;font-size:19px;color:#f0d9a8}
  #detail .py{font-size:11px;letter-spacing:1px;color:#7d8896;margin-bottom:10px}
  #detail .row{margin:9px 0;font-size:13px;line-height:1.75;color:#cfcabd}
  #detail .k{color:var(--gold);font-size:12px;letter-spacing:1px}
  #detail .close{position:absolute;right:10px;top:8px;cursor:pointer;color:#7d8896;font-size:16px}
  #stat{position:absolute;left:14px;top:14px;font-size:12px;color:#8b95a3}
  #tip{position:absolute;left:14px;bottom:14px;font-size:11px;color:var(--dim)}
  #err{position:absolute;inset:0;display:none;place-items:center;padding:40px;text-align:center;color:#e8b4b4}
  #load{position:absolute;inset:0;display:grid;place-items:center;background:rgba(13,15,18,.94);z-index:9;
    color:#7d8896;font-size:13px;text-align:center}
  #load .bar{width:220px;height:3px;background:#242a33;border-radius:2px;margin:12px auto 0;overflow:hidden}
  #load .bar i{display:block;height:100%;width:0;background:var(--gold);transition:.2s}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>经络穴位 · 361 穴</h1>
    <div class="sec">
      <div class="t">分层</div>
      <div class="layers">
        <button data-layer="skin" class="on">皮肤</button>
        <button data-layer="skeleton">骨骼</button>
        <button data-layer="muscles">肌肉</button>
        <button data-layer="meridians" class="on">经络</button>
        <button data-layer="points" class="on">穴位</button>
        <button data-layer="xray">内视</button>
        <button data-layer="rotate">自动旋转</button>
      </div>
    </div>
    <div class="sec">
      <div class="t">视角</div>
      <div class="views">
        <button data-view="front">前</button>
        <button data-view="back">后</button>
        <button data-view="left">左</button>
        <button data-view="right">右</button>
        <button data-view="top">顶</button>
        <button data-view="iso">斜</button>
      </div>
    </div>
    <input id="q" placeholder="搜索：合谷 / 足三里 / LI4">
    <div id="list"></div>
    <div id="hint">拖拽旋转 · 滚轮缩放 · 点穴位看释义<br>
      真实解剖体表（BodyParts3D）· 361 穴已投影到皮肤表面</div>
  </div>
  <div id="stage">
    <div id="stat"></div>
    <div id="detail"></div>
    <div id="tip">模型：BodyParts3D 4.3（CC BY-SA 2.1 JP）· 穴位：GB/T 12346-2021 校订 · 贴体：tools/build_real_body.py</div>
    <div id="err"></div>
    <div id="load"><div>正在加载真实人体模型…<div class="bar"><i></i></div></div></div>
  </div>
</div>

<script type="importmap">
{"imports":{
  "three":"./vendor/three.module.js",
  "three/addons/":"./vendor/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/controls/OrbitControls.js';
import { GLTFLoader } from './vendor/GLTFLoader.js';

const PALETTE = ['#C0392B','#E67E22','#F1C40F','#27AE60','#16A085','#2980B9','#8E44AD',
                 '#C0A080','#D35400','#7F8C8D','#1ABC9C','#9B7EC0','#E74C3C','#5DADE2'];
const MID_MERIDIANS = new Set([13, 14]);

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0d0f12');
const camera = new THREE.PerspectiveCamera(34, stage.clientWidth / stage.clientHeight, 0.05, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 1.2; controls.maxDistance = 60;

scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.9));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(4, 8, 7); scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.85); fill.position.set(-5, 2, -5); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffd9a0, 0.65); rim.position.set(0, -3, -6); scene.add(rim);

const state = {
  body: null, root: null, layers: {}, colorOf: {}, groups: {}, pointsByMeridian: {},
  tubes: {}, visible: new Set(), bbox: null,
};

// ── 材质：真实网格上的皮肤 / 骨 / 肌 ──────────────────────────────
const MAT = {
  skin: new THREE.MeshPhysicalMaterial({ color: 0xe6cbb2, roughness: 0.68, metalness: 0,
    clearcoat: 0.22, sheen: 0.35, sheenColor: new THREE.Color(0xffd9c0) }),
  skinX: new THREE.MeshPhysicalMaterial({ color: 0x9dbfd4, transparent: true, opacity: 0.05,
    roughness: 0.9, depthWrite: false, side: THREE.DoubleSide }),
  bone: new THREE.MeshStandardMaterial({ color: 0xf4eddd, roughness: 0.7, metalness: 0.03 }),
  muscle: new THREE.MeshStandardMaterial({ color: 0xb8473f, roughness: 0.5, metalness: 0.02,
    transparent: true, opacity: 0.6, depthWrite: false, side: THREE.DoubleSide }),
};

const loadEl = document.getElementById('load');
const barEl = loadEl.querySelector('.bar i');
const gltf = new GLTFLoader();
function loadModel(url, name) {
  return new Promise((res, rej) => gltf.load(url, g => {
    const mesh = g.scene.children[0];
    mesh.name = name;
    mesh.geometry.computeVertexNormals();
    mesh.geometry.computeBoundingSphere();
    res(mesh);
  }, e => { if (e.total) barEl.style.width = Math.min(96, e.loaded / e.total * 100) + '%'; }, rej));
}

async function load() {
  const body = await (await fetch('../data/body.json')).json();
  state.body = body;
  // 骨性标志 / 进针几何（tools/build_needling.py 实测）
  state.needling = await (await fetch('../data/needling.json')).json().catch(() => null);
  state.needlingById = {};
  (state.needling?.points || []).forEach(n => state.needlingById[n.id] = n);
  const root = new THREE.Group();
  scene.add(root); state.root = root;

  // 皮肤 3.7MB 立即加载；骨骼 21MB、肌肉 16MB 改成**首次开层才拉**，
  // 否则首屏要等 40MB，手机上直接劝退。
  const skin = await loadModel('./models/skin.glb', 'skin');
  skin.material = MAT.skin;
  root.add(skin);
  state.groups = { skin };
  window.__layers = { skin: true };

  // 用真实网格包围盒定中心与取景（比写死数字可靠）
  skin.geometry.computeBoundingBox();
  const bb = skin.geometry.boundingBox.clone();
  const h = bb.max.y - bb.min.y, cy = (bb.max.y + bb.min.y) / 2;
  root.position.y = -cy;
  state.bbox = { h, cy };
  const grid = new THREE.GridHelper(14, 14, 0x1b2430, 0x141b23);
  grid.position.y = -h / 2 - 0.05; scene.add(grid);

  // ── 经络 ───────────────────────────────────────────────────────
  const meridianGroup = new THREE.Group(); meridianGroup.name = 'meridians'; root.add(meridianGroup);
  const groups = {};
  body.acupoints.forEach(p => (groups[p.meridian_id] ||= []).push(p));
  const ids = Object.keys(groups).map(Number).sort((a, b) => a - b);
  ids.forEach((id, i) => state.colorOf[id] = PALETTE[i % PALETTE.length]);
  for (const id of ids) {
    const pts = groups[id].slice().sort((a, b) => a.id - b.id);
    const color = new THREE.Color(state.colorOf[id]);
    const isMid = MID_MERIDIANS.has(id);
    if (pts.length >= 2) {
      const curve = new THREE.CatmullRomCurve3(
        pts.map(p => new THREE.Vector3(p.pos.x, p.pos.y, p.pos.z)), false, 'catmullrom', 0.32);
      const tube = new THREE.Mesh(
        new THREE.TubeGeometry(curve, Math.max(40, pts.length * 5), isMid ? 0.020 : 0.011, 6, false),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: isMid ? 0.95 : 0.6,
          depthWrite: false }));
      tube.userData.meridian = id;
      meridianGroup.add(tube);
      state.tubes[id] = tube;
    }
    state.visible.add(id);
  }
  state.meridianGroup = meridianGroup;

  // ── 穴位：每条经一个 InstancedMesh（按经筛选只需切 visible）──────
  const pointGroup = new THREE.Group(); pointGroup.name = 'points'; root.add(pointGroup);
  const sphere = new THREE.SphereGeometry(0.028, 10, 8);
  for (const id of ids) {
    const list = groups[id];
    const color = new THREE.Color(state.colorOf[id]);
    const mat = new THREE.MeshStandardMaterial({ color, emissive: color.clone().multiplyScalar(0.55),
      roughness: 0.35, metalness: 0.05 });
    const im = new THREE.InstancedMesh(sphere, mat, list.length);
    const d = new THREE.Object3D();
    list.forEach((p, k) => {
      d.position.set(p.pos.x, p.pos.y, p.pos.z); d.updateMatrix();
      im.setMatrixAt(k, d.matrix);
      im.userData[`k${k}`] = p;
    });
    im.instanceMatrix.needsUpdate = true;
    im.userData.meridian = id;
    im.userData.list = list;
    pointGroup.add(im);
    state.pointsByMeridian[id] = im;
  }
  state.pointGroup = pointGroup;

  // 相机取景：按视场角算距离，保证头脚都在画面里
  const dist = (h * 1.12) / (2 * Math.tan((camera.fov * Math.PI / 180) / 2));
  state.homeDist = dist;
  camera.position.set(0, 0, dist);
  controls.target.set(0, 0, 0);
  controls.update();

  document.getElementById('stat').textContent =
    `${body.acupoints.length} 穴 · ${ids.length} 经脉 · 真实解剖体表 · 贴体偏差 ${body.meta?.snap?.mean_mm ?? '—'} mm（均值）`;

  buildSidebar(groups, ids);
  loadEl.style.display = 'none';
  animate();
}

function buildSidebar(groups, ids) {
  const list = document.getElementById('list');
  list.innerHTML = '';
  ids.forEach(id => {
    const row = document.createElement('label');
    row.className = 'm';
    row.innerHTML = `<input type="checkbox" checked data-mid="${id}">
      <i class="dot" style="background:${state.colorOf[id]}"></i>
      <span>${groups[id][0].meridian} <em>${groups[id].length}</em>${MID_MERIDIANS.has(id) ? ' <em>·中线</em>' : ''}</span>`;
    row.querySelector('input').addEventListener('change', e => {
      const mid = +e.target.dataset.mid;
      e.target.checked ? state.visible.add(mid) : state.visible.delete(mid);
      applyVisibility();
    });
    list.appendChild(row);
  });
}

function applyVisibility() {
  for (const [id, im] of Object.entries(state.pointsByMeridian)) im.visible = state.visible.has(+id);
  for (const [id, tube] of Object.entries(state.tubes)) tube.visible = state.visible.has(+id);
}

// ── 分层开关 ─────────────────────────────────────────────────────
const LAYER_MAP = { skin: 'skin', skeleton: 'skeleton', muscles: 'muscles' };
async function ensureModel(name) {
  if (state.groups[name]) return state.groups[name];
  const files = { skeleton: './models/skeleton.glb', muscles: './models/muscles.glb' };
  const mats = { skeleton: MAT.bone, muscles: MAT.muscle };
  const tip = document.getElementById('stat');
  const old = tip.textContent;
  tip.textContent = `正在加载${name === 'skeleton' ? '骨骼' : '肌肉'}模型…`;
  const m = await loadModel(files[name], name);
  m.material = mats[name];
  m.visible = false;
  state.root.add(m);
  state.groups[name] = m;
  window.__layers = { skin: !!state.groups.skin, skeleton: !!state.groups.skeleton, muscles: !!state.groups.muscles };
  tip.textContent = old;
  return m;
}

async function setLayer(name, on) {
  if (LAYER_MAP[name]) {
    const m = await ensureModel(LAYER_MAP[name]);
    m.visible = on;
  }
  if (name === 'meridians') state.meridianGroup.visible = on;
  if (name === 'points') state.pointGroup.visible = on;
}
document.querySelectorAll('.layers button').forEach(btn => {
  btn.addEventListener('click', async () => {
    const name = btn.dataset.layer;
    if (name === 'rotate') {
      state.rotate = !state.rotate; btn.classList.toggle('on', state.rotate); return;
    }
    const on = !state.layers[name];
    state.layers[name] = on;
    btn.classList.toggle('on', on);
    if (name === 'xray') {
      state.groups.skin.material = on ? MAT.skinX : MAT.skin;
      state.groups.skin.visible = true;
      document.querySelector('.layers button[data-layer="skin"]').classList.add('on');
      state.layers.skin = true;
      return;
    }
    await setLayer(name, on);
    // 看内部结构时皮肤自动转内视，否则不透明皮肤把骨骼肌肉全挡住
    if ((name === 'skeleton' || name === 'muscles') && on && state.groups.skin.material !== MAT.skinX) {
      state.groups.skin.material = MAT.skinX;
      state.groups.skin.visible = true;
      document.querySelector('.layers button[data-layer="xray"]').classList.add('on');
      document.querySelector('.layers button[data-layer="skin"]').classList.add('on');
      state.layers.skin = true; state.layers.xray = true;
    }
  });
});
state.layers = { skin: true, meridians: true, points: true, skeleton: false, muscles: false, xray: false };

// ── 视角 ────────────────────────────────────────────────────────
document.querySelectorAll('.views button').forEach(btn => {
  btn.addEventListener('click', () => {
    const d = state.homeDist || 15;
    const V = { front: [0, 0, d], back: [0, 0, -d], left: [-d, 0, 0],
                right: [d, 0, 0], top: [0, d, 0.01], iso: [d * 0.62, d * 0.34, d * 0.72] };
    camera.position.set(...V[btn.dataset.view]);
    controls.target.set(0, 0, 0); controls.update();
  });
});

// ── 进针模拟（沿穴位法向扎入，长度可拖）────────────────────────────
const needleGroup = new THREE.Group(); needleGroup.visible = false; scene.add(needleGroup);
const needleMat = new THREE.MeshStandardMaterial({ color: 0xe8f1ff, metalness: 0.85, roughness: 0.2,
  emissive: new THREE.Color(0x5b8fd6), emissiveIntensity: 0.9 });
const needleBody = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.008, 1, 10), needleMat);
needleBody.geometry.translate(0, -0.5, 0);   // 以顶端为原点，向 -y 延伸
const boneDot = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 10),
  new THREE.MeshBasicMaterial({ color: 0xff6b6b }));
needleGroup.add(needleBody, boneDot);

const Z_AXIS = new THREE.Vector3(0, -1, 0);
function placeNeedle(p, need) {
  const pos = new THREE.Vector3(p.pos.x, p.pos.y, p.pos.z);
  const inward = new THREE.Vector3(need.inward[0], need.inward[1], need.inward[2]).normalize();
  needleGroup.position.copy(pos);
  needleGroup.quaternion.setFromUnitVectors(Z_AXIS, inward);
  const mmAvail = need.needle_to_bone_mm ?? need.nearest_bone_mm;
  const dm = (mmAvail || 0) / 1000 / 0.198;                 // mm → 本项目单位
  boneDot.position.set(0, -dm, 0);
  boneDot.visible = !!mmAvail;
  window.__needleMax = dm;
  needleBody.scale.y = dm * (Number(document.getElementById('depth')?.value ?? 100) / 100);
  needleGroup.visible = true;
}

// ── 点击拾取（对每经的 InstancedMesh 做射线检测）──────────────────
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  const targets = Object.values(state.pointsByMeridian).filter(m => m.visible);
  const hit = ray.intersectObjects(targets, false)[0];
  if (!hit) return;
  const im = hit.object;
  const p = im.userData.list[hit.instanceId];
  if (p) showDetail(p);
});

function showDetail(p) {
  const el = document.getElementById('detail');
  const n = state.needlingById[p.id];
  el.style.display = 'block';
  el.innerHTML = `<span class="close" onclick="document.getElementById('detail').style.display='none'">×</span>
    <h2>${p.name}</h2>
    <div class="py">${p.py} · ${p.meridian}</div>
    <div class="row"><div class="k">标准定位</div>${p.location || '—'}</div>
    <div class="row"><div class="k">释义</div>${p.shiyi || '—'}</div>
    <div class="row"><div class="k">功能主治</div>${p.func || '—'}</div>
    <div class="row"><div class="k">体表坐标</div>x=${p.pos.x.toFixed(2)} y=${p.pos.y.toFixed(2)} z=${p.pos.z.toFixed(2)}</div>
    ${n ? `<div class="row"><div class="k">下方骨性结构</div>${n.bone_zh || '—'}${
        n.nearest_bone_mm != null ? ` · 皮肤→骨 <b>${n.nearest_bone_mm} mm</b>` : ''}${
        n.needle_to_bone_mm != null ? `（沿法向触骨 ${n.needle_to_bone_mm} mm）` : ''}</div>
      <div class="row"><div class="k">进针模拟</div>
        <input id="depth" type="range" min="0" max="100" value="100" style="width:100%"
          oninput="window.__setDepth&&window.__setDepth(this.value)">
        <div style="font-size:11px;color:#7d8896">沿体表法向扎入，滑到头正好触骨。<br>
          数据为模型几何实测，<b>不是临床进针深度</b>；关节附近的"最近骨"可能是邻骨。</div>
      </div>` : ''}`;
  if (n) placeNeedle(p, n); else needleGroup.visible = false;
  window.__setDepth = v => { needleBody.scale.y = (window.__needleMax || 0.1) * (Number(v) / 100); };
}

// 供自动化/调试：按名字直接选中穴位（等价于点它）
window.__pick = name => {
  const p = state.body?.acupoints?.find(a => a.name === name);
  if (!p) return 'not found';
  showDetail(p);
  const wp = new THREE.Vector3(p.pos.x, p.pos.y, p.pos.z);
  controls.target.copy(wp);
  camera.position.copy(wp.clone().add(new THREE.Vector3(0.9, 0.45, 1.5)));
  controls.update();
  return `${p.name} ${state.needlingById[p.id]?.bone_zh || ''} ${state.needlingById[p.id]?.nearest_bone_mm ?? ''}`;
};

// ── 搜索：命中即拉近 ─────────────────────────────────────────────
document.getElementById('q').addEventListener('input', e => {
  const kw = e.target.value.trim();
  if (!kw) return;
  const up = kw.toUpperCase();
  const hit = state.body.acupoints.find(p => p.name.includes(kw) || p.py.toUpperCase().startsWith(up));
  if (!hit) return;
  state.visible.add(hit.meridian_id); applyVisibility();
  showDetail(hit);
  const wp = new THREE.Vector3(hit.pos.x, hit.pos.y, hit.pos.z);
  controls.target.copy(wp);
  camera.position.copy(wp.clone().add(new THREE.Vector3(1.8, 0.8, 2.6)));
  controls.update();
});

let t0 = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const t = performance.now();
  if (state.rotate) {
    const dt = (t - t0) / 1000; t0 = t;
    const r = Math.hypot(camera.position.x, camera.position.z);
    const ang = Math.atan2(camera.position.z, camera.position.x) + dt * 0.3;
    camera.position.x = Math.cos(ang) * r;
    camera.position.z = Math.sin(ang) * r;
  } else t0 = t;
  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = stage.clientWidth / stage.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(stage.clientWidth, stage.clientHeight);
});

load().catch(err => {
  loadEl.style.display = 'none';
  const el = document.getElementById('err');
  el.style.display = 'grid';
  el.textContent = '加载失败：' + err.message;
});
window.__ready = false;
</script>
</body>
</html>
